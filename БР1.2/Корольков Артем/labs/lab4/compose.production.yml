x-service: &service
  restart: unless-stopped
  environment:
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    SERVICE_KEY: ${SERVICE_KEY:?SERVICE_KEY is required}
    RABBITMQ_URL: amqp://restaurant:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672
  volumes:
    - /var/lib/restaurant-lab4/data:/app/services/data
  healthcheck: &health
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    interval: 10s
    timeout: 5s
    start_period: 60s
    retries: 12
  logging: &logs
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"

services:
  rabbitmq:
    restart: unless-stopped
    ports: !reset []
    hostname: restaurant-lab4-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: restaurant
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    logging: *logs

  auth-service:
    <<: *service

  restaurant-service:
    <<: *service

  reservation-service:
    <<: *service

  api-gateway:
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:3010:3010"
    healthcheck: *health
    logging: *logs

networks:
  default:
    name: restaurant-lab4

volumes:
  rabbit_data:
